<!DOCTYPE html>
<html lang = "ru">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>C днём рождения, мама! </title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>С днём рождения, мама! ❤️</h1>

    <p>Ты самый дорогой человек в моей жизни!</p>

    <div class="cake-container">
        
        <div class="cake">

            <div class="candle">
                <div class="flame"></div>
            </div>

            <div class="icing"></div>

            <div class="cake-top"></div>

            <div class="cake-bottom"></div>

            <div class="plate"></div>

        </div>

    </div>

    <p class="hint">
        🎂 Загадай желание, мама!
    </p>

    <button id="blowButton"> 🌬 Задуть свечу </button>

    <div id="message" class="hidden">
        <h2>💖 Мамочка, с днём рождения!</h2>

        <p>
            Спасибо за твою любовь, заботу и тепло.
            Ты самое дорогое, что у меня есть!
        </p>

        <p>Я тебя очень люблю!❤️</p>
    </div>

    <script src="script.js"></script>

</body>
</html>
